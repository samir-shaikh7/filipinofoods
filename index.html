<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFC93C" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Best Filipino Restaurant in Kuwait — Authentic Food Delivery</title>
    <meta name="description" content="Order authentic Filipino food in Kuwait. Char-grilled Chicken Inasal, Sizzling Sisig, and BBQ delivered hot in 30 minutes. Best Filipino Restaurant for catering and group meals." />
    <link rel="canonical" href="https://filipinofoodkuwait.com" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Best Filipino Restaurant in Kuwait — Filipino Food Delivery" />
    <meta property="og:description" content="Authentic Inasal, Sisig, and Filipino BBQ delivered hot to your doorstep. Tap to order on WhatsApp." />
    <meta property="og:image" content="https://filipinofoodkuwait.com/og-image.jpg" />
    <meta property="og:url" content="https://filipinofoodkuwait.com" />

    <!-- Structured Data: Restaurant Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Filipino Food Restaurant Kuwait",
      "image": "https://filipinofoodkuwait.com/logo.jpeg",
      "url": "https://filipinofoodkuwait.com",
      "telephone": "+965639999999999",
      "priceRange": "$$",
      "menu": "https://filipinofoodkuwait.com/#menu",
      "servesCuisine": "Filipino",
      "acceptsReservations": "false",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Kuwait City",
        "addressLocality": "Kuwait City",
        "addressRegion": "Kuwait",
        "addressCountry": "KW"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:00",
          "closes": "23:00"
        }
      ],
      "potentialAction": {
        "@type": "OrderAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://filipinofoodkuwait.com/#menu",
          "inLanguage": "en-US",
          "actionPlatform": [
            "http://schema.org/DesktopWebPlatform",
            "http://schema.org/MobileWebPlatform"
          ]
        },
        "deliveryMethod": ["http://purl.org/goodrelations/v1#DeliveryModeDirectOutward"],
        "priceSpecification": {
          "@type": "DeliveryChargeSpecification",
          "appliesToDeliveryMethod": "http://purl.org/goodrelations/v1#DeliveryModeDirectOutward",
          "price": 0.00,
          "priceCurrency": "KWD"
        }
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
